<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CoreJunkie Desktop</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px auto; max-width: 1050px; }
      .row { display: flex; gap: 12px; margin-bottom: 12px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      input, select, button { padding: 8px; }
      .error { color: #c62828; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>CoreJunkie Desktop App</h1>

    <div id="authSection" class="card">
      <h3>Register</h3>
      <div class="row">
        <input id="regName" placeholder="Display name" />
        <input id="regEmail" placeholder="Email" />
        <input id="regPassword" placeholder="Password" type="password" />
        <button id="registerBtn">Register</button>
      </div>

      <h3>Login</h3>
      <div class="row">
        <input id="loginEmail" placeholder="Email" />
        <input id="loginPassword" placeholder="Password" type="password" />
        <button id="loginBtn">Login</button>
      </div>
      <p id="authError" class="error"></p>
    </div>

    <div id="appSection" class="hidden">
      <p>Logged in as <b id="who"></b></p>

      <div class="card">
        <h3>Add Product</h3>
        <div class="row">
          <input id="pName" placeholder="Product name" />
          <input id="pCategory" placeholder="Category" />
          <input id="pSize" type="number" step="0.01" placeholder="Size" />
          <select id="pUnit"><option>fl_oz</option><option>ml</option><option>count</option></select>
          <button id="addProductBtn">Save product</button>
        </div>
      </div>

      <div class="card">
        <h3>Add Inventory Entry</h3>
        <div class="row">
          <select id="invProduct"></select>
          <input id="invPurchased" type="date" />
          <input id="invOpened" type="date" />
        </div>
        <div class="row">
          <input id="invCadenceValue" type="number" step="0.01" placeholder="Cadence value" />
          <select id="invCadenceUnit"><option value="">Unit</option><option value="day">day</option><option value="week">week</option></select>
          <input id="invAmountPerUse" type="number" step="0.01" placeholder="Amount/use" />
          <button id="addInventoryBtn">Save inventory</button>
        </div>
      </div>

      <div class="card">
        <h3>Your Inventory</h3>
        <table>
          <thead><tr><th>Product</th><th>Purchased</th><th>Opened</th><th>Cadence</th><th>Amount/use</th><th>Expected run out</th></tr></thead>
          <tbody id="inventoryRows"></tbody>
        </table>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
