{% extends 'base.html' %}
{% block content %}
<h2>Add Inventory Entry</h2>
<form method="post" action="{{ base_path }}/inventory/new">
  <div>
    <select name="product_id" required>
      <option value="">Select product</option>
      {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }} ({{ p.size_value }} {{ p.size_unit }})</option>
      {% endfor %}
    </select>
  </div>
  <div><label>Purchased at <input name="purchased_at" type="date" required /></label></div>
  <div><label>Opened at <input name="opened_at" type="date" /></label></div>
  <div><input name="cadence_value" type="number" step="0.01" min="0" placeholder="Cadence value (e.g., 2)" /></div>
  <div>
    <select name="cadence_unit">
      <option value="">Cadence unit</option>
      <option value="day">day</option>
      <option value="week">week</option>
    </select>
  </div>
  <div><input name="amount_per_use" type="number" step="0.01" min="0" placeholder="Amount per use" /></div>
  <button type="submit">Save Inventory</button>
</form>
{% if error %}<p style="color:crimson;">{{ error }}</p>{% endif %}
{% endblock %}
