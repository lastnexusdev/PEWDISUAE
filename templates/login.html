{% extends 'base.html' %}
{% block content %}
<h2>Login</h2>
<form method="post" action="{{ base_path }}/login">
  <div><input name="email" placeholder="Email" required type="email" /></div>
  <div><input name="password" placeholder="Password" required type="password" /></div>
  <button type="submit">Login</button>
</form>
{% if error %}<p style="color:crimson;">{{ error }}</p>{% endif %}
{% endblock %}
