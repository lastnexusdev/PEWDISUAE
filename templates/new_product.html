{% extends 'base.html' %}
{% block content %}
<h2>Add Product</h2>
<form method="post" action="{{ base_path }}/products/new">
  <div><input name="name" placeholder="Product name" required /></div>
  <div><input name="category" placeholder="Category" required /></div>
  <div><input name="size_value" type="number" step="0.01" min="0.01" placeholder="Size" required /></div>
  <div>
    <select name="size_unit">
      <option value="fl_oz">fl_oz</option>
      <option value="count">count</option>
      <option value="ml">ml</option>
    </select>
  </div>
  <button type="submit">Save Product</button>
</form>
{% if error %}<p style="color:crimson;">{{ error }}</p>{% endif %}
{% endblock %}
